    type: VNTH-T2_v2
    ieee: '0xa4c1382027b99401'
    sensors:
      temperature: {ieee: '0xa4c1385ebc1e2739', name: "Bad OG Luft"}
      windows: [{ieee: '0xa4c1381a9ca8d52c', name: "Bad OG"}]
  Caros:
    day_hour: "05:00"
    day_temperature: 21.5
    night_hour: "23:00"
    night_temperature: 19.5
    type: TRVZB
    ieee: '0xc09b9efffe712b8a'
    sensors:
      windows: [{ieee: '0xa4c138a2899d7f40', name: "Caro Fenster"}]
  Dusche:
