        sensor: "Waschküche Luft"
        below: 50
  "WC OG":
    day_hour: "05:00"
    day_temperature: 19.5
    night_hour: "23:00"
    night_temperature: 18.5
    type: VNTH-T2_v2
    ieee: '0xa4c138fcd63c7be6'
    sensors:
      windows: [{ieee: '0xa4c13853fd53d84d', name: "WC OG Fenster"}]
  Wohnzimmer:
    day_hour: "05:00"
