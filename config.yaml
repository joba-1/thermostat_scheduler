mqtt:
  broker: 192.168.1.4
  port: 1883
  base_topic: zigbee2mqtt
  delay_between_messages: 5
  check_timeout: 1
  unseen_interval: 21600      # thermostat "no life sign" threshold (seconds); TRVs
                              # only publish on change and routinely go 5 h quiet, so
                              # don't flag until 6 h without a sign of life
  stale_temp_hours: 4         # alert if a TRV's local_temperature hasn't *changed*
                              # within this long — a frozen reading on a still-alive
                              # device flags an unreliable sensor. 0 disables.
  # username: mqtt_user       # optional; prefer env THERMOSTAT_MQTT_USER/PASS or a 600 secrets file
  # password: mqtt_pass


# --- Operator alerting (manager daemon) ---
alerts:
  enabled: true
  mail_to: joachim.banzhaf@gmail.com
  send_mail_cmd: ~/bin/send-mail.py
  digest_hour: 7             # send the daily report at this local hour. It lists
                             # every issue seen in the last 24h — still-open AND
                             # already-resolved — then resets. Routine issues only
                             # appear here; they never mail on their own.
  # Immediate mail is reserved for service start/stop and `critical` readings
  # (extraordinary temperature/humidity):
  extreme:
    temp_min: 10              # °C
    temp_max: 45              # °C
    humidity_min: 20          # %RH
    humidity_max: 90          # %RH
  max_mails_per_day: 6        # backstop cap on immediate (critical/service) mails/day
                             # (the daily report is exempt).
  # Project wiki page with per-alarm remediation hints; linked as a footer in
  # every mail. The #Alarms anchor jumps straight to the alarm table.
  wiki_url: "http://job4:8000/wiki/ThermostatScheduler#Alarms"
  battery_limit: 20          # percent; below this -> battery_low
  eval_interval: 60          # seconds between evaluation passes (cheap, all in-memory;
                             # matches the web page's 60s refresh so it shows fresh data)
  state_file: ~/.local/state/thermostat_manager/alerts.json


# Last known device/sensor readings, restored on restart so status reports
# aren't blank until each device next publishes (stale entries still get a
# fresh no-life-sign grace window after startup).
device_state_file: ~/.local/state/thermostat_manager/devices.json


# Read-only status web page (serves the latest cached overview; no auth).
web:
  enabled: true
  host: "0.0.0.0"      # bind address; 0.0.0.0 = reachable on the LAN
  port: 8099
  refresh: 60          # client auto-refresh interval (seconds)
  z2m_url: "http://192.168.1.4:8082"   # zigbee2mqtt frontend; device name cells link here
  history:             # per-room history charts (read on demand from HA InfluxDB)
    influx_url: http://job4:8086
    database: homeassistant


# --- EMS-ESP heat pump (read directly from MQTT, not Home Assistant) ---
heatpump:
  enabled: true
  boiler_topic: ems-esp/boiler_data
  thermostat_topic: ems-esp/thermostat_data
  fields:                     # canonical name -> EMS-ESP field name
    activity: hpactivity      # live compressor activity (heating/cooling/off/defrost)
    vorlauf: curflowtemp
    ruecklauf: rettemp
    outdoor: outdoortemp
    power: hpcurrpower
    pressure: syspress
  cooling_when:  # fallback only: used when the pump reports no hc1.hpoperatingstate
  - field: hpcooling          # ems-esp/thermostat_data hc1.hpcooling: cooling enabled
    equals: "on"              # stable across compressor cycles (unlike hpactivity)
    # Avoid keying off hpactivity (toggles each compressor cycle) or hp4way
    # (reads "cooling & defrost" from a resting valve even in winter).
    # hpcooling is only the cooling *release*: it lags hpmode by cooloffdelay
    # (72 h), so it is no season signal — the season uses hpmode/hpoperatingstate.
  bounds:                     # operator sanity ranges -> digest warning if outside
    heating:
      vorlauf: [20, 60]
      pressure: [1.0, 2.5]
    cooling:
      vorlauf: [8, 25]
      pressure: [1.0, 2.5]
  # Feed a Zigbee room sensor's temperature + humidity to the heat pump as its
  # remote thermostat reading. The pump uses humidity for its dew-point guard
  # (the real lever gating cooling), so a fresh value matters.
  #
  # Multiple candidate sensors are merged: each republish picks the one with the
  # HIGHEST temperature among those that (a) report both temp and humidity, (b)
  # aren't completely stale (within stale_after), and (c) whose room has no open
  # window. The warmest room drives the most conservative dew-point limit. temp
  # AND humidity always come from the same sensor (coherent dew point). If none
  # qualify we keep publishing the last value AND raise an alert.
  remote_feed:
    enabled: true
    sensors:                    # candidates; highest fresh temp (window closed) wins
    - {ieee: '0xa4c13835190efbf5', room: "Wohnzimmer", name: "Wohnzimmer Luft"}
    - {ieee: '0xa4c138e03a0a1f5b', room: "Arbeitszimmer", name: "Arbeitszimmer Bewegungsmelder"}
      # Schlafzimmer has no temp+humidity sensor (TRV reports temperature only),
      # so it cannot drive the dew-point feed; add one here once it exists.
    control_topic: ems-esp/thermostat/hc1/control
    control_value: RC100H       # published once per connect: sets remote thermostat type
    temp_topic: ems-esp/thermostat/hc1/remotetemp
    hum_topic: ems-esp/thermostat/hc1/remotehum
    interval: 60                # seconds between republishes of the selected value
    stale_after: 3600           # a candidate older than this (1 h) is "completely stale" -> excluded
    temp_offset: -3             # K added to the fed temperature: sensors sit high, air at
                                # radiator/pipe level is ~3K cooler. Lowers the pump's dew
                                # floor -> colder flow (down to the hpminflowtemp=18 floor).


# --- Season / cooling control ---
season:
  mode: auto                  # auto | heating | cooling | standby
  source: heatpump            # when auto: heatpump | outdoor_temp | config
                              #   heatpump     -> follow the pump: hc1.hpmode (main
                              #                   switch) bounds the season, hc1.
                              #                   hpoperatingstate heating/cooling is
                              #                   taken as-is; while it idles ('off')
                              #                   the previous season holds
                              #   outdoor_temp -> 3-season heat/standby/cool from the
                              #                   outdoor temperature (see below)
  control: true               # true = actively drive TRVs to the season state;
                              # false = report-only (flag drifted valves, don't push)
  cool_target: 21             # reference room temp used by the comfort check in cooling
  # Standby ("shoulder weather"): neither heating nor cooling — TRVs switched off,
  # warm-water production continues (it is independent of the heating circuit).
  # With source==outdoor_temp: heat below standby_below, cool above standby_above,
  # standby in between. hysteresis widens the standby band by that many °C on the
  # side we're already in, so a reading hovering near a threshold doesn't flap.
  standby_below: 15           # °C outdoor: below this -> heating
  standby_above: 24           # °C outdoor: above this -> cooling
  standby_hysteresis: 1       # °C band to avoid flapping at either threshold
  # source==heatpump: the pump idle (neither heating nor cooling) this long ->
  # standby; shorter gaps (summer-mode afternoons, the ~1 h heating<->cooling
  # changeover) keep the previous season so the valves aren't re-driven.
  standby_after_hours: 24
  # Mail the manual_thermostats reminder once a new season has held this long.
  # 0 = at once: a hand-set valve left open for cooling must not heat its room for
  # hours. (In hpmode "heating & cooling" the pump can flip twice a day -> 2 mails.)
  manual_reminder_after_hours: 0


# Grace before a room temperature deviation becomes a loud alert: while the
# room is still moving toward target, or the target changed less than this many
# minutes ago, the deviation is reported only as a quiet digest note.
comfort_grace_minutes: 30


# Expected pace at which a room works off a temperature deviation. While the
# room is closing the gap at least this fast, the deviation stays a quiet note;
# slower than this (stalled or merely crawling) escalates to a loud alert.
# Default 60 = 1 °C per hour, so a 2 °C deviation should clear within ~2 h.
comfort_minutes_per_degree: 60


sensors:
  battery_limit: 20
  unseen_interval: 21600      # contact/temp sensors report less often than TRVs;
                              # 5 h quiet is common, so don't flag until 6 h
  stale_temp_hours: 4         # alert if a temperature sensor's reading hasn't
                              # *changed* within this long (frozen value). 0 disables.


# --- Window/door -> TRV control (moved here from Home Assistant) ---
# When a room's contact sensor opens, switch that room's TRV off; when it closes,
# restore the room's intended state (season-aware: cooling -> open, heating ->
# schedule). Only rooms the monitor itself switched off are restored, so a user's
# manual off is never overridden; manual-override rooms are left untouched.
window_control:
  enabled: true
  act: true                   # false = detect + log + show in status, but don't publish
  ignore: true                # cool/heat regardless of open windows (warning shown)
  open_debounce: 5            # seconds a window must stay open before switching off
  close_debounce: 5           # seconds closed before restoring
  disable_builtin: true       # on connect, turn off each TRV's own window detection


# --- Radiator fans (smart plugs) --- switched on while the HP actively cools.
# Fill in the actual device names and set enabled: true when the ventilators are in.
# DISABLED 2026-07-29 per request: no automation for the ventilators until further
# notice. All plugs were switched OFF manually; re-enable to resume fan control.
fan_control:
  enabled: true    # re-enabled 2026-07-31 per request (was disabled 2026-07-29)
  act: true
  # Fans run only while water circulates through the radiators: heating-circuit
  # pump PC1 flow (`pc1flow`) above min_flow l/h and no hot-water charge. PC1 keeps
  # running through the compressor's pauses, feeding the buffer's heat/cold.
  heating: true                # also support heating (per fan: `heating: false` opts out)
  # Per fan with a `room`: fans only support — within the last room_margin °C to
  # the room's target (below the scheduled setpoint when heating, above the cool
  # target when cooling) the fan goes off; back on room_hysteresis further out.
  # Also off while a window of the room is open.
  room_margin: 1.0
  room_hysteresis: 0.5
  on_debounce: 30
  off_delay: 120               # s to keep fans ON after circulation stops (radiators
                               # still hold some heat/cold for a while)
  fans:
    # heating: false on Schlafzimmer + Wohnzimmer (2026-09-23): a fan there is not
    # wanted in the heating season for now.
    - { type: tasmota, topic: "nous3", power: POWER, room: "Schlafzimmer", heating: false }  # Nous A1T plug -> cmnd/nous3/POWER - Schlafzimmer
    - { type: tasmota, topic: "nous4", power: POWER, room: "Bad OG" }  # Nous A1T plug -> cmnd/nous4/POWER - Bad OG
    - { type: zigbee, name: "Wohnzimmer Fan Plug", room: "Wohnzimmer", heating: false }   # -> zigbee2mqtt/<name>/set {"state":ON|OFF}
    - { type: zigbee, name: "NZ1 Esszimmer Lüfter", room: "Esszimmer" }   # -> zigbee2mqtt/<name>/set {"state":ON|OFF}
    - { type: zigbee, name: "NZ2 Julians Lüfter", room: "Julians" }   # -> zigbee2mqtt/<name>/set {"state":ON|OFF}
    - { type: zigbee, name: "NZ3 Dusche", room: "Dusche" }   # -> zigbee2mqtt/<name>/set {"state":ON|OFF}
    - { type: zigbee, name: "Z2 Arbeitszimmer Fan Plug", room: "Arbeitszimmer" }   # -> zigbee2mqtt/<name>/set {"state":ON|OFF}

# --- Free-cooling reminder: mail "open windows" when outside air < warmest room ---
free_cooling:
  enabled: true
  margin: 2
  remind_interval_hours: 8


# Dumb / manual radiator valves that cannot be controlled remotely. The manager
# can't actuate these, so on every heating<->cooling change it mails a reminder
# to OPEN them fully (cooling) or set them back to normal (heating).
manual_thermostats: ["WC UG", "Küche", "Flur EG", "Treppenhaus"]   # hand-set radiator valves


default_tolerance: 1.5        # °C the room may deviate from setpoint before warning
default_no_reaction_minutes: 60


thermostat_types:
  VNTH-T2_v2:
    schedule_mode:
      temperature_sensitivity: 0.5
      system_mode: heat
      preset: schedule
    cooling_open:             # force fully open: comfort preset at a high temp
      preset: comfort
      comfort_temperature: 34
    cooling_restore:
      preset: schedule
    manual_marker:            # end user took control
      field: preset
      equals: manual
    builtin_window_off:       # disable the TRV's own window detection (monitor drives)
      window_detection: "OFF"
    off_signature:            # "our" window-off: off + frost guard (distinct from a user's plain off)
      system_mode: "off"
      frost_protection: "ON"
    off_clear:                # undo the off marker when restoring
      frost_protection: "OFF"
  TR-M3Z:
    schedule_mode:
      system_mode: heat
      preset: schedule
    cooling_open:
      preset: comfort
      comfort_temperature: 34
    cooling_restore:
      preset: schedule
    manual_marker:
      field: preset
      equals: manual
    builtin_window_off:
      window_detection: "OFF"
    off_signature:
      system_mode: "off"
      frost_protection: "ON"
    off_clear:
      frost_protection: "OFF"
  ME168_1:
    schedule_mode:
      system_mode: auto
    cooling_open:
      system_mode: heat
      current_heating_setpoint: 34
    cooling_restore:
      system_mode: auto
    manual_marker:
      field: system_mode
      equals: heat
    off_signature:
      system_mode: "off"
      frost_protection: "ON"
    off_clear:
      frost_protection: "OFF"
  ME167:
    schedule_mode:
      system_mode: auto
    cooling_open:
      system_mode: heat
      current_heating_setpoint: 34
    cooling_restore:
      system_mode: auto
    manual_marker:
      field: system_mode
      equals: heat
    off_signature:
      system_mode: "off"
      frost_protection: "ON"
    off_clear:
      frost_protection: "OFF"
  TRVZB:
    schedule_mode:
      system_mode: auto
      temperature_accuracy: -0.6
      valve_opening_degree: 100    # re-assert the clamp: a stuck 0 never heats
    schedule_prefix: weekly_schedule
    cooling_open:
      system_mode: heat
      occupied_heating_setpoint: 34
      valve_opening_degree: 100
    cooling_restore:
      system_mode: auto
      valve_opening_degree: 100
    manual_marker:
      field: system_mode
      equals: heat
    builtin_window_off:
      open_window: "OFF"
    # Our off marker is the valve clamp, not a setpoint sentinel: writing
    # occupied_heating_setpoint flips system_mode back to heat, but
    # valve_opening_degree survives (measured: setting it to 0 while the valve was
    # demanding left system_mode heat and drove running_state to idle). It is a
    # clamp, not an actuator — 0 forces the valve shut, 100 does *not* open it —
    # and it is not reachable from the device buttons, so only we produce it.
    # This finally gives TRVZB a self-describing "our off" instead of relying on
    # the software latch alone.
    off_signature:
      system_mode: "off"
      valve_opening_degree: 0
    off_clear:
      valve_opening_degree: 100
  # SONOFF TRV Gen2 (TRV-ZBT, Telink TLSR8258, needs zigbee2mqtt >= 2.12.1 and a
  # current coordinator firmware -- it would not even try to join Z-Stack
  # 20221226). Like TRVZB, but: setpoint range 5-30 (not 4-35), the valve limit
  # is heating_valve_position (not valve_opening_degree), and three weekly
  # schedules -- group 1 is both edited and active (pinned below). It reports
  # 12 slots per day, padding ours by repeating the last one; the comparison
  # collapses that (common.schedules_equal). Measured 2026-09-24 on Schlafzimmer.
  TRV-ZBT:
    schedule_mode:
      system_mode: auto
      temperature_accuracy: -0.6
      heating_valve_position: 100    # re-assert the clamp: a stuck 0 never heats
      schedule_group_to_edit: "1"
      schedule_active_group: "1"
    schedule_prefix: weekly_schedule
    cooling_open:
      system_mode: heat
      occupied_heating_setpoint: 30  # the maximum; fully open all the same
      heating_valve_position: 100
    cooling_restore:
      system_mode: auto
      heating_valve_position: 100
    manual_marker:
      field: system_mode
      equals: heat
    builtin_window_off:
      open_window: "OFF"
    # Same "our off" as TRVZB: the valve clamp at 0 (verified: off + 0 is
    # applied and reported back; auto + 100 restores it).
    off_signature:
      system_mode: "off"
      heating_valve_position: 0
    off_clear:
      heating_valve_position: 100
  # ME168_1 / ME167 (AVATTO) have no built-in window detection -> nothing to disable.


thermostats:
  Arbeitszimmer:
    day_hour: "09:00"
    day_temperature: 21.5
    night_hour: "23:00"
    night_temperature: 19.5
    type: ME168_1
    ieee: '0xa4c138ce0c805e8c'
    sensors:
      temperature: {ieee: '0xa4c138e03a0a1f5b', name: "Arbeitszimmer Bewegungsmelder"} # motion sensor (temp+humidity); more reliable than Marshall Klima here
      windows: [{ieee: '0xa4c13855054afc24', name: "Arbeitszimmer Fenster"}]
  "Bad OG":
    day_hour: "05:00"
