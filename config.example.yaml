# Annotated example configuration for the thermostat scheduler + manager.
# Copy to config.yaml and adjust. Credentials should NOT live here in
# production: prefer env vars (THERMOSTAT_MQTT_USER/PASS) or a mode-600 secrets
# file. See docs/admin.md.

mqtt:
  broker: 192.168.1.4          # MQTT broker host/IP
  port: 1883
  base_topic: zigbee2mqtt      # zigbee2mqtt base topic
  delay_between_messages: 5    # seconds between scheduler pushes
  check_timeout: 1             # seconds the scheduler --check waits for replies
  unseen_interval: 21600       # thermostat "no life sign" threshold (seconds);
                               # TRVs publish only on change and often go 5 h quiet —
                               # keep this generous (6 h here; per-thermostat override
                               # allowed under thermostats:)
  stale_temp_hours: 4          # alert if a TRV's local_temperature hasn't *changed*
                               # within this long (a frozen reading on a live device
                               # = unreliable sensor). 0 disables.
  # username: mqtt_user
  # password: mqtt_pass

alerts:
  enabled: true
  mail_to: you@example.com     # default recipient (send-mail uses its own default if unset)
  send_mail_cmd: ~/bin/send-mail.py
  # from_name: thermostat_monitor  # sender display name (default: script name)
  digest_hour: 7              # send the daily report at this local hour. It lists
                              # every issue seen in the last 24h — still-open AND
                              # already-resolved — then resets. Routine issues
                              # (battery, life-sign, comfort drift, ...) only ever
                              # appear here; they never mail on their own.
  # Immediate mail is reserved for two things: service start/stop, and
  # `critical` readings — extraordinary temperature/humidity. Tune those here:
  extreme:
    temp_min: 10               # °C; a reading below this mails immediately
    temp_max: 45               # °C; a reading above this mails immediately
    humidity_min: 20           # %RH
    humidity_max: 90           # %RH
  max_mails_per_day: 6         # backstop cap on immediate (critical/service) mails/day
                              # (daily report exempt). Overflow waits for the report.
  # wiki_url: http://trac/wiki/ThermostatScheduler#Alarms  # per-alarm remediation
                              # hints; appended as a footer link to every mail.
  battery_limit: 20           # percent
  eval_interval: 300          # seconds between evaluation passes
  state_file: ~/.local/state/thermostat_manager/alerts.json

# Last known device/sensor readings, restored on restart so reports aren't
# blank until every device next publishes. Stale entries still get a fresh
# no-life-sign grace window after startup.
device_state_file: ~/.local/state/thermostat_manager/devices.json

# Read-only status web page. Serves the latest cached status overview (the same
# data as the mailed report) on a tiny built-in HTTP server. No authentication,
# so only expose it on a trusted LAN. Omit or set enabled:false to disable.
web:
  enabled: false
  host: "0.0.0.0"      # bind address; 0.0.0.0 = reachable on the LAN, 127.0.0.1 = local only
  port: 8099
  refresh: 60          # client-side auto-refresh interval in seconds (0 = no refresh)
  history:             # per-room history charts (click a room's temperature on the page)
    influx_url: http://job4:8086   # Home Assistant's InfluxDB (read-only, on demand)
    database: homeassistant
    # HA entity ids are resolved from each device's ieee + friendly name: the named
    # slug is tried first, then HA's 0x<ieee>_<property> fallback (used when HA never
    # got a friendly name). No per-room overrides needed.

heatpump:
  enabled: true
  boiler_topic: ems-esp/boiler_data
  thermostat_topic: ems-esp/thermostat_data
  fields:
    vorlauf: curflowtemp       # flow temperature
    ruecklauf: rettemp         # return temperature
    outdoor: outdoortemp
    power: hpcurrpower
    pressure: syspress
  cooling_when:                # OR'd conditions; house is "cooling" if any matches
    - field: hpcooling         # hc1.hpcooling: cooling enabled, stable across cycles
      equals: "on"
    # Avoid hpactivity (toggles per compressor cycle) and hp4way (reads
    # "cooling & defrost" even from a resting valve in winter).
  bounds:                      # warn (digest) if telemetry leaves these ranges
    heating:
      vorlauf: [20, 60]
      pressure: [1.0, 2.5]
    cooling:
      vorlauf: [8, 25]
      pressure: [1.0, 2.5]
  # Feed a Zigbee room sensor to the heat pump as its remote thermostat reading.
  # The pump uses humidity for dew-point protection (gates cooling). Multiple
  # candidates are merged: each republish picks the warmest room that has fresh
  # temp+humidity (same sensor) and no open window; if none qualify, the last
  # good value keeps being published AND an alert is raised.
  remote_feed:
    enabled: false               # set true once the source sensors are confirmed
    sensors:                     # candidates; highest fresh temp (window closed) wins
      - { ieee: 0xa4c13835190efbf5, name: "Wohnzimmer Luft", room: "Wohnzimmer" }
      - { ieee: 0xa4c1381f896f8d67, name: "Schlafzimmer Luft", room: "Schlafzimmer" }
    # legacy forms still accepted: {sensor: "Wohnzimmer Luft", room: ...} or a bare string
    control_topic: ems-esp/thermostat/hc1/control
    control_value: RC100H        # sent once per connect: registers the remote thermostat type
    temp_topic: ems-esp/thermostat/hc1/remotetemp
    hum_topic: ems-esp/thermostat/hc1/remotehum
    interval: 60                 # seconds between republishes of the selected value
    stale_after: 3600            # a candidate older than this (1 h) is excluded as "completely stale"
    temp_offset: 0               # K added to the fed temperature (calibration). Comfort/dew
                                 # sensors often sit high; air near the radiators is cooler, so a
                                 # negative offset feeds a more representative temp and lowers the
                                 # pump's dew-point floor (colder flow, bounded by hpminflowtemp).

season:
  mode: auto                   # auto | heating | cooling | standby
  source: outdoor_temp         # when auto: heatpump | outdoor_temp | config
                               #   heatpump     -> binary heat/cool from the pump
                               #   outdoor_temp -> 3-season heat/standby/cool below
  control: true                # true: manager drives thermostats to the season state;
                               # false: report-only (flag drifted valves, don't write —
                               # e.g. if another controller owns them)
  cool_target: 24              # comfort-check reference temperature in cooling
  # Standby ("shoulder weather"): neither heating nor cooling — TRVs off, warm
  # water keeps running (independent of the heating circuit). With source==
  # outdoor_temp: heat below standby_below, cool above standby_above, standby
  # between; hysteresis widens the band on the side we're in to avoid flapping.
  standby_below: 15            # °C outdoor: below this -> heating
  standby_above: 24            # °C outdoor: above this -> cooling
  standby_hysteresis: 1        # °C anti-flap band at each threshold

# Grace before a room-temperature deviation becomes a loud alert. While the
# room is still moving toward target (or the target changed less than this many
# minutes ago), the deviation is only a quiet digest note, not an alert.
comfort_grace_minutes: 30

# Expected pace for working off a deviation: 1 °C per this many minutes (60 =
# 1 °C/h). Closing the gap slower than this escalates the note to a loud alert.
comfort_minutes_per_degree: 60

sensors:
  battery_limit: 20
  unseen_interval: 21600       # 5 h quiet is common for battery sensors; flag at 6 h
  stale_temp_hours: 4          # alert if a sensor's temperature reading is frozen
                               # (unchanged) this long. 0 disables.

# Window/door -> TRV control. Open a room's contact -> switch its TRV off; close
# it -> restore the intended (season-aware) state. Only rooms the monitor itself
# switched off are restored, so a user's manual off is never overridden; manual-
# override rooms are skipped. Per-room overrides under thermostats: window: {...}.
window_control:
  enabled: true
  act: true                    # false = detect + log + show in status, don't publish
  ignore: false                # true = cool/heat regardless of open windows (never
                               # switch a TRV off); a warning is shown in status/web/mail
  open_debounce: 5             # s a window must stay open before switching off
  close_debounce: 5            # s closed before restoring
  disable_builtin: true        # on connect, turn off each TRV's own window detection


# --- Radiator fans (smart plugs) ---
# Switch fan plugs ON while the heat pump is actively cooling (hpactivity==cooling)
# to boost radiator heat transfer; an off_delay keeps them running through the
# compressor's off-gaps (a buffer tank still feeds cold to the radiators then).
fan_control:
  enabled: false
  act: true                    # false = log "would publish ..." only, don't switch
  on_debounce: 30              # s cooling must be active before switching fans on
  off_delay: 600               # s to keep fans ON after cooling stops (use residual cold)
  fans:                        # zigbee (zigbee2mqtt) and/or tasmota plugs
    - { type: zigbee, name: "Schlafzimmer Ventilator" }   # -> zigbee2mqtt/<name>/set {"state":ON|OFF}
    - { type: tasmota, topic: "ventilator_wz", power: POWER }  # -> cmnd/<topic>/<power> ON|OFF


# --- Free-cooling reminder ---
# In cooling, when the (raw) outside air is cooler than the warmest room by `margin`,
# mail an "open windows" reminder — the heat pump idles below its cooling-start outdoor
# temp, but ventilation still cools. Shown as a "Free cooling" line in status/web/mail.
free_cooling:
  enabled: true
  margin: 2                    # °C the outside must be below the warmest room
  remind_interval_hours: 8     # min hours between reminder mails (avoids flapping)

# Dumb / manual radiator valves the manager cannot control. On every
# heating<->cooling change it mails a reminder to open them (cooling) or set
# them back to normal (heating).
manual_thermostats: []         # e.g. ["Keller", "Gäste WC"]

default_tolerance: 1.5         # °C room may deviate from setpoint before warning
default_no_reaction_minutes: 60

# Per type: how to push the schedule, force fully open for cooling, restore, and
# detect end-user manual override. cooling_open/cooling_restore mirror schedule_mode.
thermostat_types:
  # off_signature = "our" window-off, made distinct from a user's plain off so we
  # only auto-restore what we set (off + a frost guard, or an off + setpoint
  # sentinel). off_clear undoes the marker on restore. State is classified by
  # matching these signatures; anything that matches none is treated as manual.
  VNTH-T2_v2:
    schedule_mode: {temperature_sensitivity: 0.5, system_mode: heat, preset: schedule}
    cooling_open: {preset: comfort, comfort_temperature: 34}
    cooling_restore: {preset: schedule}
    manual_marker: {field: preset, equals: manual}
    builtin_window_off: {window_detection: "OFF"}   # disabled so the monitor drives
    off_signature: {system_mode: "off", frost_protection: "ON"}
    off_clear: {frost_protection: "OFF"}
  TRVZB:
    schedule_mode: {system_mode: auto, temperature_accuracy: -0.6}
    schedule_prefix: weekly_schedule
    cooling_open: {system_mode: heat, occupied_heating_setpoint: 34}
    cooling_restore: {system_mode: auto}
    manual_marker: {field: system_mode, equals: heat}
    builtin_window_off: {open_window: "OFF"}
    # No off_signature: SONOFF flips system_mode->heat on a setpoint write, so
    # window-off uses plain system_mode:off tracked by the software latch.
  # AVATTO ME168/ME167 have no built-in window detection -> no builtin_window_off.

# Devices are identified by their zigbee ieee address (stable across renames) and
# displayed by their friendly name. Give each device an `ieee` plus a human `name`;
# the live friendly name (MQTT topic) is resolved from z2m's bridge/devices registry,
# so a device renamed in z2m is still tracked. A bare string (just the friendly name)
# is still accepted for back-compat — then the ieee is looked up from the registry by
# name, which is NOT rename-proof.
thermostats:
  Wohnzimmer:
    day_hour: "06:00"
    day_temperature: 21.5
    night_hour: "23:00"
    night_temperature: 19.5
    type: VNTH-T2_v2
    ieee: 0xa4c1386e2bd2e3b9    # the TRV (was implicit "<room> Thermostat")
    tolerance: 1.5             # optional per-room override
    no_reaction_minutes: 60    # optional per-room override
    sensors:
      temperature: { ieee: 0xa4c13835190efbf5, name: "Wohnzimmer Luft" }
      windows: [ { ieee: 0xa4c1380f2108b149, name: "Wohnzimmer Fenster" } ]
    window:                             # optional per-room window-control overrides
      debounce: 5                       # override open/close debounce (s)
      # humidity_guard: {sensor: "Wohnzimmer Luft", below: 50}  # only ventilate when dry

# Sensors not tied to a heated room (still battery/life-sign monitored):
# extra_sensors:
#   - { ieee: 0x..., name: "Dach Luft", kind: temperature }
